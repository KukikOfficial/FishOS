name: Build LiteOS ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib g++-multilib grub-pc-bin grub-common xorriso mtools

      - name: Compile and generate ISO
        run: make

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteOS-ISO
          path: myos.iso
