set timeout=1
set default=0
insmod all_video
set gfxmode=1024x768x32,auto
set gfxpayload=keep

menuentry "FishOS" {
    multiboot /boot/fihcore.elf init=/system/bin/init
    module /boot/initrd.tar
    boot
}

menuentry "FishOS (no data disk mount)" {
    multiboot /boot/fihcore.elf init=/system/bin/init root=none
    module /boot/initrd.tar
    boot
}
